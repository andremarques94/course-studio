<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Course Studio</title>
  <desc id="description">Course Studio dark-mode cover with a Markdown editor and live presentation preview.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(600 70) rotate(90) scale(300 540)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b687c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0b687c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#272b2f" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-30%" width="130%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="498" rx="20" fill="#090b0d" stroke="#24282c" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="498" rx="20" fill="url(#glow)"/>

  <g transform="translate(52 35)">
    <rect width="24" height="24" rx="6" fill="#0b171b" stroke="#0d7f98"/>
    <rect x="7" y="7" width="5" height="5" rx="1" fill="#1592ad"/>
    <rect x="10.5" y="10.5" width="5" height="5" rx="1" fill="#1592ad"/>
    <rect x="14" y="14" width="5" height="5" rx="1" fill="#1592ad"/>
    <text x="35" y="17" fill="#f4f4f5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Course Studio</text>
  </g>

  <g transform="translate(1061 37)" font-family="Arial, Helvetica, sans-serif" font-size="9">
    <rect width="62" height="20" rx="10" fill="#15181b" stroke="#2b3035"/>
    <text x="31" y="13.5" text-anchor="middle" fill="#a8adb3">PRE-ALPHA</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="145" fill="#f4f4f5" font-size="58" font-weight="700" letter-spacing="-3.2">Build the lesson,</text>
    <text x="600" y="205" fill="#f4f4f5" font-size="58" font-weight="700" letter-spacing="-3.2">not the slide deck.</text>
    <text x="600" y="247" fill="#9da3aa" font-size="17">Turn your Markdown notes into beautiful presentations.</text>
  </g>

  <g transform="translate(478 272)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">
    <rect width="112" height="34" rx="6" fill="#08768e"/>
    <text x="19" y="22" fill="#f3fbfc">Open Studio</text>
    <path d="M88 17h9m-4-4 4 4-4 4" fill="none" stroke="#f3fbfc" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="122" width="120" height="34" rx="6" fill="#15181b"/>
    <text x="140" y="22" fill="#e5e7e9">See how it works</text>
  </g>

  <g transform="translate(140 342)" filter="url(#shadow)">
    <rect width="920" height="220" rx="10" fill="#0e1012" stroke="#303439"/>
    <rect width="920" height="40" rx="10 10 0 0" fill="#0b0d0f"/>
    <line y1="40" x2="920" y2="40" stroke="#2a2e32"/>

    <rect x="14" y="14" width="12" height="12" rx="3" fill="#0b171b" stroke="#0d7f98"/>
    <text x="35" y="24" fill="#e4e7e9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">Introducing Course Studio</text>
    <text x="830" y="24" fill="#8f969d" font-family="Arial, Helvetica, sans-serif" font-size="9">Draft</text>
    <rect x="856" y="9" width="50" height="22" rx="4" fill="#08768e"/>
    <text x="881" y="23.5" text-anchor="middle" fill="#f3fbfc" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700">Present</text>

    <rect y="40" width="36" height="180" fill="#101214"/>
    <line x1="36" y1="40" x2="36" y2="220" stroke="#2a2e32"/>
    <rect x="12" y="54" width="12" height="12" rx="3" fill="#0b2025" stroke="#0d7f98"/>
    <rect x="12" y="79" width="12" height="12" rx="3" fill="none" stroke="#484e54"/>
    <rect x="12" y="104" width="12" height="12" rx="3" fill="none" stroke="#484e54"/>

    <rect x="36" y="40" width="362" height="180" fill="#0c0e10"/>
    <line x1="398" y1="40" x2="398" y2="220" stroke="#2a2e32"/>
    <text x="50" y="60" fill="#9299a0" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing=".7">EDITOR</text>
    <line x1="36" y1="72" x2="398" y2="72" stroke="#25292d"/>
    <g font-family="Courier New, monospace" font-size="10">
      <text x="64" y="103" fill="#f2f3f4" font-weight="700"># Course Studio</text>
      <text x="64" y="130" fill="#a3a8ad">Turn Markdown notes into presentations.</text>
      <text x="64" y="158" fill="#1592ad">---</text>
      <text x="64" y="187" fill="#f2f3f4" font-weight="700">## Write. Preview. Present.</text>
    </g>

    <rect x="398" y="40" width="522" height="180" fill="#111416"/>
    <text x="412" y="60" fill="#9299a0" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing=".7">PREVIEW</text>
    <line x1="398" y1="72" x2="920" y2="72" stroke="#25292d"/>
    <rect x="398" y="72" width="522" height="148" fill="url(#grid)"/>
    <rect x="486" y="92" width="346" height="194" rx="2" fill="#18181b" stroke="#303034"/>
    <text x="518" y="122" fill="#71cedd" font-family="Courier New, monospace" font-size="8" letter-spacing="1">02 / 04</text>
    <text x="518" y="166" fill="#fafafa" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="-1.2">Write. Preview. Present.</text>
    <text x="518" y="191" fill="#a1a1aa" font-family="Arial, Helvetica, sans-serif" font-size="10">Shape course material without fighting presentation tools.</text>
  </g>
</svg>
